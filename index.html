<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio - Adri</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Georgia, "Times New Roman", serif;
    background:#efefef;
    padding:24px;
}

.container{
    background:#f5f3ee;
    min-height:100vh;
    border:1px solid #d8d8d8;
}

/* ================= HEADER ================= */

header{
    height:105px;
    background:#f8f8f8;
    border-bottom:2px solid #1f1f1f;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 70px;
}

.logo{
    font-size:2rem;
    color:#222;
}

.nav{
    display:flex;
    align-items:center;
    gap:35px;
    font-family:sans-serif;
}

.nav a{
    text-decoration:none;
    color:#222;
    font-size:1.1rem;
}

.btn-nav{
    background:#7f8b78;
    color:#111;
    padding:16px 28px;
    border-radius:999px;
    border:2px solid #333;
    text-decoration:none;
    font-weight:500;
}

/* ================= HERO ================= */

.hero{
    display:grid;
    grid-template-columns: 1fr 1fr;
    align-items:center;
    gap:70px;
    padding:100px 70px;
}

.badge{
    display:inline-block;
    background:#5d5d5d;
    color:white;
    padding:10px 16px;
    font-family:sans-serif;
    font-size:1rem;
    margin-bottom:45px;
    box-shadow:0 5px 12px rgba(0,0,0,.2);
}

.hero h1{
    font-size:6rem;
    line-height:0.95;
    font-weight:400;
    color:#111;
    margin-bottom:35px;
}

.hero p{
    max-width:600px;
    font-size:1.15rem;
    line-height:1.5;
    color:#222;
    margin-bottom:50px;
}

.btn-primary{
    display:inline-flex;
    justify-content:center;
    align-items:center;

    width:370px;
    height:72px;

    background:#b45452;
    color:#111;
    text-decoration:none;

    border-radius:999px;
    border:2px solid #222;

    font-family:sans-serif;
    font-size:1.25rem;
}

.hero-image{
    display:flex;
    justify-content:center;
}

.hero-image img{
    width:100%;
    max-width:560px;
    border-radius:60px;
    object-fit:cover;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 1024px){

    .hero{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:4.5rem;
    }

    .hero-image{
        order:-1;
    }
}

@media (max-width: 768px){

    header{
        padding:20px;
        height:auto;
        flex-direction:column;
        gap:20px;
    }

    .hero{
        padding:60px 30px;
    }

    .hero h1{
        font-size:3.5rem;
    }

    .btn-primary{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <header>
        <div class="logo">Adri</div>

        <nav class="nav">
            <a href="#">Projets</a>
            <a href="#" class="btn-nav">Prendre rendez-vous</a>
        </nav>
    </header>

    <section class="hero">

        <div class="hero-content">

            <span class="badge">Adri</span>

            <h1>
                Bonjour, je<br>
                m'appelle Adri.
            </h1>

            <p>
                J'aide les petites entreprises et les entrepreneurs
                à créer des expériences numériques abouties.
            </p>

            <a href="#" class="btn-primary">
                Travailler avec moi
            </a>

        </div>

        <div class="hero-image">
            <img src="photo.jpg" alt="Adri">
        </div>

    </section>

</div>

</body>
</html>
